name: erm-platform

networks:
  default:
    name: erm-platform-network

services:
  front:
    container_name: erm-front
    image: erm-front:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4200:80"
    volumes:
      - ../src:/app/src
    restart: always
