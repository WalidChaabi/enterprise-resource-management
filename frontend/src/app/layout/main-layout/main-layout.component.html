<app-sidebar-provider>
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-primary focus:px-4 focus:py-2 focus:text-primary-foreground">
    {{ 'a11y.skipToContent' | translate }}
  </a>
  <app-sidebar [theme]="theme()"></app-sidebar>

  <app-sidebar-inset>
    <header class="z-40 w-full shrink-0 border-b border-subtle bg-sidebar">
      <div class="flex h-14 w-full items-center gap-3 px-8 2xl:px-10">
        <app-sidebar-trigger>
          <lucide-icon [img]="PanelLeft" [size]="18" />
        </app-sidebar-trigger>
        <div class="flex min-w-0 items-center gap-2">
          <button
            type="button"
            class="toolbar-icon-btn"
            (click)="goBack()"
            [attr.aria-label]="'Go back'">
            <lucide-icon [img]="ChevronLeft" [size]="16" />
          </button>
          <div class="min-w-0">
            <app-breadcrumb [items]="breadcrumbs()"></app-breadcrumb>
          </div>
        </div>
        <div class="hidden md:flex items-center ml-2 shrink-0">
          <app-org-switcher
            [organizations]="organizations()"
            [currentName]="currentOrganization()"
            (orgSelected)="switchOrganization($event)"></app-org-switcher>
        </div>
        <div class="hidden md:flex items-center ml-4 min-w-0 flex-1">
          <div class="w-full min-w-0">
            <app-search-bar></app-search-bar>
          </div>
        </div>
        <div class="flex shrink-0 items-center gap-1.5 ml-auto">
          <app-quick-action-menu></app-quick-action-menu>
          <app-notification-menu
            [items]="notifications()"
            (markAll)="markNotificationsRead()"></app-notification-menu>
          <app-help-menu
            [documentationUrl]="uiConfig().documentationUrl"
            [supportUrl]="uiConfig().supportUrl"
            (shortcuts)="openShortcuts()"></app-help-menu>
          <div class="flex gap-0.5 rounded-[10px] bg-muted/40 p-0.5">
            @for (lang of languages; track lang.code) {
              <button
                class="inline-flex h-8 w-8 items-center justify-center rounded-[8px] text-xs font-semibold uppercase text-muted-foreground transition-colors duration-150 hover:bg-accent hover:text-foreground [&.active]:bg-accent [&.active]:text-foreground"
                [class.active]="currentLanguage() === lang.code"
                (click)="setLanguage(lang.code)"
                [attr.aria-label]="'Switch to ' + lang.label"
                [title]="lang.label">
                <span>{{ lang.code }}</span>
              </button>
            }
          </div>
          <button
            class="toolbar-icon-btn"
            (click)="toggleTheme()"
            [attr.aria-label]="'Toggle ' + (theme() === 'dark' ? 'light' : 'dark') + ' mode'"
            type="button">
            @if (theme() === 'dark') {
              <lucide-icon [img]="Sun" [size]="18" />
            } @else {
              <lucide-icon [img]="Moon" [size]="18" />
            }
          </button>
          <a
            routerLink="/search"
            class="md:hidden toolbar-icon-btn"
            [title]="'search.title' | translate">
            <lucide-icon [img]="Search" [size]="18" />
          </a>
          <app-user-menu
            class="md:hidden"
            variant="toolbar"
            [userName]="userFullName()"
            [userEmail]="userEmail()"
            (logout)="logout()" />
        </div>
      </div>
    </header>

    <div class="flex min-h-0 min-w-0 flex-1 flex-col w-full overflow-y-auto bg-background">
      <div id="main-content" tabindex="-1" class="page-content w-full max-w-none">
        <router-outlet></router-outlet>
      </div>
    </div>
    <app-keyboard-shortcuts
      [open]="shortcutsOpen()"
      [shortcuts]="shortcuts()"
      (closed)="closeShortcuts()"></app-keyboard-shortcuts>
  </app-sidebar-inset>
</app-sidebar-provider>
