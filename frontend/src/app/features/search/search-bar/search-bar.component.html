<div class="relative w-full">
  <div class="search-bar-premium">
    <div class="flex items-center px-3 py-2.5 text-muted-foreground">
      <lucide-icon name="search" [size]="16" />
    </div>
    <input
      type="text"
      data-search-input="true"
      [value]="query()"
      (input)="onQueryChange($any($event.target).value)"
      (keyup.enter)="onSearch()"
      (focus)="showResults.set(true)"
      placeholder="{{ 'search.placeholder' | translate }}"
      class="flex-1 border-0 bg-transparent py-2.5 pr-3 text-sm focus-visible:outline-none placeholder:text-muted-foreground"
    />
  </div>

  @if (showResults() && (query().length >= 2 || selectedTypes().length > 0)) {
    <div class="absolute z-50 mt-2 w-full rounded-xl border border-subtle bg-popover p-4 shadow-card max-h-[400px] overflow-y-auto">
      <div class="mb-3 text-xs font-medium text-muted-foreground">{{ 'search.filterByType' | translate }}</div>
      <div class="flex flex-wrap gap-2 mb-4">
        @for (type of entityTypes; track type.value) {
          <button
            (click)="toggleEntityType(type.value)"
            [class.bg-primary]="selectedTypes().includes(type.value)"
            [class.text-primary-foreground]="selectedTypes().includes(type.value)"
            class="rounded-[8px] border border-subtle px-2.5 py-1 text-xs transition-colors duration-150 hover:bg-accent"
            type="button">
            {{ type.label | translate }}
          </button>
        }
      </div>
      @if (query().trim().length >= 2) {
        <button
          (click)="onSearch()"
          [disabled]="searching()"
          class="w-full inline-flex items-center justify-center rounded-[10px] bg-primary px-4 py-2.5 text-sm font-medium text-primary-foreground transition-colors duration-150 hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50"
          type="button">
          @if (searching()) {
            <lucide-icon name="loader-2" [size]="16" class="mr-2 animate-spin" />
          }
          {{ 'search.search' | translate }}
        </button>
      }
    </div>
  }
</div>
