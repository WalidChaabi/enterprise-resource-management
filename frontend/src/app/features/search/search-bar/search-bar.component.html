<div class="relative w-full">
  <div class="flex items-center rounded-md border border-input bg-background overflow-hidden">
    <div class="flex items-center px-3 py-2 text-muted-foreground border-r border-input bg-muted/50">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
    <input
      type="text"
      data-search-input="true"
      [value]="query()"
      (input)="onQueryChange($any($event.target).value)"
      (keyup.enter)="onSearch()"
      (focus)="showResults.set(true)"
      placeholder="{{ 'search.placeholder' | translate }}"
      class="flex-1 border-0 bg-transparent px-3 py-2 text-sm focus-visible:outline-none focus-visible:ring-0 placeholder:text-muted-foreground"
    />
  </div>

  @if (showResults() && (query().length >= 2 || selectedTypes().length > 0)) {
    <div class="absolute z-50 mt-2 w-full rounded-md border bg-popover p-4 shadow-lg max-h-[400px] overflow-y-auto">
      <div class="mb-3 text-xs font-medium text-muted-foreground">{{ 'search.filterByType' | translate }}</div>
      <div class="flex flex-wrap gap-2 mb-4">
        @for (type of entityTypes; track type.value) {
          <button
            (click)="toggleEntityType(type.value)"
            [class.bg-primary]="selectedTypes().includes(type.value)"
            [class.text-primary-foreground]="selectedTypes().includes(type.value)"
            class="rounded-md border px-2 py-1 text-xs hover:bg-accent transition-colors"
            type="button">
            {{ type.label | translate }}
          </button>
        }
      </div>
      @if (query().trim().length >= 2) {
        <button
          (click)="onSearch()"
          [disabled]="searching()"
          class="w-full inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50"
          type="button">
          @if (searching()) {
            <div class="mr-2 h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"></div>
          }
          {{ 'search.search' | translate }}
        </button>
      }
    </div>
  }
</div>
