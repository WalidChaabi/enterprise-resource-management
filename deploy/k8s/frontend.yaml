apiVersion: v1
kind: Service
metadata:
  name: erm-front
  namespace: erm
  labels:
    app.kubernetes.io/name: erm-front
    app.kubernetes.io/part-of: erm-platform
spec:
  selector:
    app.kubernetes.io/name: erm-front
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erm-front
  namespace: erm
  labels:
    app.kubernetes.io/name: erm-front
    app.kubernetes.io/part-of: erm-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erm-front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erm-front
        app.kubernetes.io/part-of: erm-platform
    spec:
      containers:
        - name: erm-front
          # Replace with your registry image, e.g. ghcr.io/<owner>/<repo>/erm-front:latest
          image: erm-front:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
