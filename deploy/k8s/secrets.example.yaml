# Copy to secrets.yaml and replace placeholders before applying.
#   cp secrets.example.yaml secrets.yaml
#   kubectl apply -f secrets.yaml
#
# Generate JWT secret: openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: erm-secrets
  namespace: erm
  labels:
    app.kubernetes.io/part-of: erm-platform
type: Opaque
stringData:
  POSTGRES_USER: erm_user
  POSTGRES_PASSWORD: change-me-use-a-strong-password
  DB_USER: erm_user
  DB_PASS: change-me-use-a-strong-password
  JWT_SECRET: change-me-minimum-32-characters-required
