apiVersion: v1
kind: Service
metadata:
  name: erm-db
  namespace: erm
  labels:
    app.kubernetes.io/name: erm-db
    app.kubernetes.io/part-of: erm-platform
spec:
  selector:
    app.kubernetes.io/name: erm-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erm-db
  namespace: erm
  labels:
    app.kubernetes.io/name: erm-db
    app.kubernetes.io/part-of: erm-platform
spec:
  serviceName: erm-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erm-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erm-db
        app.kubernetes.io/part-of: erm-platform
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: erm-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: erm-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erm-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - erm_user
                - -d
                - erm_db
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - erm_user
                - -d
                - erm_db
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
