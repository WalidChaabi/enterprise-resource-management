spring.datasource.url=jdbc:h2:mem:ermdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=erm
spring.jpa.properties.hibernate.packagesToScan=com.company.erm.entity
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# JWT Configuration for tests
jwt.secret=test-secret-key-minimum-32-characters-long-for-testing-only
jwt.expiration=86400000
jwt.refresh-expiration=604800000

erm.encryption.key=test-encryption-key-minimum-32-characters-long

# Flyway disabled for tests (using H2 in-memory)
spring.flyway.enabled=false

cors.allowed-origins=http://localhost:4200
erm.demo-data.enabled=true
erm.oauth2.enabled=false

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

