# Production profile overrides
erm.demo-data.enabled=${ERM_DEMO_DATA_ENABLED:false}
management.health.diskspace.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
auth.cookie.secure=true

# Trust X-Forwarded-* from nginx reverse proxy (TLS termination at front)
server.forward-headers-strategy=framework

# Restrict to your public origin(s). Comma-separated, no trailing slash.
# Example: https://app.example.com,https://www.example.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://localhost}
