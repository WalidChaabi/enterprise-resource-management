spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/erm_db}
spring.datasource.username=${DB_USER:erm_user}
spring.datasource.password=${DB_PASS:erm_pass}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:erm}
spring.jpa.properties.hibernate.packagesToScan=com.company.erm.entity
# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:erm}
spring.flyway.default-schema=${DB_SCHEMA:erm}
# Set to true in DEV only if you need to repair checksum mismatches
# NEVER enable in production - create new migrations instead
spring.flyway.repair-on-migrate=${FLYWAY_REPAIR_ON_MIGRATE:false}
server.port=${SERVER_PORT:8080}

# CORS Configuration
# Comma-separated list of allowed origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT Configuration
# WARNING: JWT_SECRET is REQUIRED and must be at least 32 characters (256 bits)
# Generate a secure secret: openssl rand -base64 32
# Never commit the actual secret to version control
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Dedicated encryption key for secrets at rest (MFA TOTP seeds). Separate from JWT_SECRET.
# Generate: openssl rand -base64 32
erm.encryption.key=${ERM_ENCRYPTION_KEY}

auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# Pagination defaults for list endpoints (Task 3.2)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Demo seed from Flyway V3 (admin@demo.com). Disabled automatically in prod profile.
erm.demo-data.enabled=${ERM_DEMO_DATA_ENABLED:true}

# Rate limiting for auth-sensitive POST endpoints (requests per minute per client IP + path)
erm.rate-limit.requests-per-minute=${ERM_RATE_LIMIT_REQUESTS_PER_MINUTE:10}

# Spring Boot Actuator Configuration
# Expose health and info endpoints publicly, others require authentication
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
# Health check details for Kubernetes liveness/readiness probes
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.threshold=10GB
# Metrics configuration
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name:erm-backend}
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:dev}

# Keyboard shortcuts exposed via settings API
settings.shortcuts[0].key=Shift + /
settings.shortcuts[0].action=Open shortcuts
settings.shortcuts[1].key=/
settings.shortcuts[1].action=Global search
settings.shortcuts[2].key=A
settings.shortcuts[2].action=Quick actions
settings.shortcuts[3].key=N
settings.shortcuts[3].action=Notifications

# UI config (help menu links)
ui.documentation-url=${UI_DOCUMENTATION_URL:https://docs.example.com}
ui.support-url=${UI_SUPPORT_URL:https://support.example.com}
ui.shortcuts-enabled=${UI_SHORTCUTS_ENABLED:true}

# Self-serve signup (MT-A)
erm.signup.enabled=${ERM_SIGNUP_ENABLED:true}

# Stripe billing (MT-B) — disabled when api key is empty
stripe.enabled=${STRIPE_ENABLED:false}
stripe.api-key=${STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price-id=${STRIPE_PRICE_ID:}
stripe.currency=${STRIPE_CURRENCY:eur}
stripe.portal-return-url=${STRIPE_PORTAL_RETURN_URL:http://localhost:4200/settings/billing}
stripe.checkout-success-url=${STRIPE_CHECKOUT_SUCCESS_URL:http://localhost:4200/settings/billing?checkout=success}
stripe.checkout-cancel-url=${STRIPE_CHECKOUT_CANCEL_URL:http://localhost:4200/settings/billing?checkout=cancel}

# SMTP email notifications (MT-G) — disabled by default; set MAIL_ENABLED=true to send
erm.mail.enabled=${MAIL_ENABLED:false}
erm.mail.host=${MAIL_HOST:localhost}
erm.mail.port=${MAIL_PORT:1025}
erm.mail.username=${MAIL_USERNAME:}
erm.mail.password=${MAIL_PASSWORD:}
erm.mail.smtp-auth=${MAIL_SMTP_AUTH:false}
erm.mail.start-tls=${MAIL_SMTP_STARTTLS:false}
erm.mail.from=${MAIL_FROM:noreply@example.com}
erm.mail.from-name=${MAIL_FROM_NAME:ERM Platform}
erm.mail.frontend-url=${MAIL_FRONTEND_URL:http://localhost:4200}

# Outbound webhooks (MT-H)
erm.webhooks.poll-interval-ms=${WEBHOOK_POLL_INTERVAL_MS:30000}

spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration

# SSO / OIDC (MT-D) — disabled unless OAUTH2_ENABLED=true and client IDs are set via env
erm.oauth2.enabled=${OAUTH2_ENABLED:false}
erm.oauth2.frontend-url=${OAUTH2_FRONTEND_URL:http://localhost:4200}
erm.oauth2.issuer-name=${OAUTH2_ISSUER_NAME:ERM Platform}
