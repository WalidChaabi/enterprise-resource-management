name: erm-platform

networks:
  default:
    name: erm-platform-network

services:
  backend:
    container_name: erm-backend
    image: erm-backend:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
