name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests
      
      - name: Run tests
        run: ./mvnw test
      
      - name: OWASP Dependency-Check
        timeout-minutes: 25
        run: ./mvnw -B org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 14
      
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
      
      - name: Unit tests
        run: npm test
      
      - name: npm audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Build
        run: npm run build -- --configuration=production

  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Prepare Docker env
        working-directory: docker
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=erm_db
          POSTGRES_USER=erm_user
          POSTGRES_PASSWORD=ci_smoke_pass
          JWT_SECRET=ci-smoke-jwt-secret-minimum-32-chars
          JWT_EXPIRATION=86400000
          ERM_DEMO_DATA_ENABLED=true
          CORS_ALLOWED_ORIGINS=http://localhost:4200
          EOF

      - name: Start stack
        working-directory: docker
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait --timeout 300

      - name: Run Playwright smoke tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:4200
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down stack
        if: always()
        working-directory: docker
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v --remove-orphans
